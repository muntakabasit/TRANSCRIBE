<svg xmlns="http://www.w3.org/2000/svg" width="420" height="930" viewBox="0 0 420 930" role="img"><title>URL-only — material availability is honest</title><rect x="0" y="0" width="420" height="930" rx="0" fill="#F5F2EB" stroke="none" stroke-width="1" opacity="1"/><rect x="0" y="0" width="420" height="48" rx="0" fill="#FFFDF8" stroke="none" stroke-width="1" opacity="1"/><text x="26" y="31" font-family="Lato" font-size="14" font-weight="bold" fill="#1E302B" >2:41</text><circle cx="368" cy="24" r="4" fill="#1E302B" stroke="none" stroke-width="1"/><rect x="378" y="20" width="19" height="9" rx="3" fill="#1E302B" stroke="none" stroke-width="1" opacity="1"/><path d="M0 50L420 50" stroke="#D6D8CF" stroke-width="1" fill="none"/><path d="M28 82l6-10 6 10 6-10 6 10" stroke="#1E302B" stroke-width="2.6" stroke-linecap="round" fill="none"/><text x="66" y="82" font-family="Lato" font-size="12" font-weight="bold" fill="#1E302B" letter-spacing="2.2">TRANSCRIBE</text><text x="324" y="82" font-family="Lato" font-size="10" font-weight="normal" fill="#69736D" letter-spacing="0.6">03 / LINK ONLY</text><text x="28" y="132" font-family="Lato" font-size="13" font-weight="normal" fill="#69736D" >‹ Library</text><text x="28" y="189" font-family="DejaVu Serif" font-size="36" font-weight="normal" fill="#1E302B" >Saved link</text><text x="28" y="219" font-family="Lato" font-size="14" font-weight="normal" fill="#69736D" >A place to return to, even when</text><text x="28" y="240" font-family="Lato" font-size="14" font-weight="normal" fill="#69736D" >the original media is not kept.</text><rect x="28" y="273" width="364" height="302" rx="8" fill="#E4E5DC" stroke="none" stroke-width="1" opacity="1"/><circle cx="210" cy="371" r="41" fill="none" stroke="#B8BEB4" stroke-width="2"/><path d="M195 372l12 12 23-26" fill="none" stroke="#748579" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="123" y="445" font-family="Lato" font-size="11" font-weight="bold" fill="#1E302B" letter-spacing="1.2">LINK PRESERVED</text><text x="80" y="476" font-family="Lato" font-size="14" font-weight="normal" fill="#69736D" >The video is not stored here.</text><text x="68" y="501" font-family="Lato" font-size="12" font-weight="normal" fill="#69736D" >There is no play button until it is.</text><rect x="28" y="605" width="364" height="58" rx="8" fill="#1E302B" stroke="none" stroke-width="1" opacity="1"/><text x="153" y="640" font-family="Lato" font-size="15" font-weight="bold" fill="#FFFDF8" >Open original</text><rect x="28" y="674" width="364" height="56" rx="8" fill="#FFFDF8" stroke="#D6D8CF" stroke-width="1" opacity="1"/><text x="152" y="707" font-family="Lato" font-size="14" font-weight="bold" fill="#1E302B" >Choose a file</text><text x="28" y="765" font-family="Lato" font-size="10" font-weight="bold" fill="#69736D" letter-spacing="1.2">WHAT TRANSCRIBE KEPT</text><text x="28" y="789" font-family="Lato" font-size="16" font-weight="normal" fill="#1E302B" >Source link only</text><text x="28" y="812" font-family="Lato" font-size="12" font-weight="normal" fill="#69736D" >No local video or transcript is available.</text><rect x="0" y="854" width="420" height="76" rx="0" fill="#FFFDF8" stroke="none" stroke-width="1" opacity="1"/><path d="M0 854L420 854" stroke="#D6D8CF" stroke-width="1" fill="none"/><circle cx="135" cy="880" r="10" fill="none" stroke="#1E302B" stroke-width="1.6"/><path d="M129 877L141 877" stroke="#1E302B" stroke-width="1.5" fill="none"/><path d="M129 882L141 882" stroke="#1E302B" stroke-width="1.5" fill="none"/><text x="112" y="906" font-family="Lato" font-size="12" font-weight="bold" fill="#1E302B" >Library</text><circle cx="282" cy="880" r="11" fill="none" stroke="#1E302B" stroke-width="1.5"/><path d="M274 880L290 880" stroke="#1E302B" stroke-width="1.5" fill="none"/><path d="M282 872L282 888" stroke="#1E302B" stroke-width="1.5" fill="none"/><text x="259" y="906" font-family="Lato" font-size="12" font-weight="normal" fill="#69736D" >Capture</text><r